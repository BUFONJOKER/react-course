<html>
  <head>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@latest?dev",
          "react-dom/client": "https://esm.sh/react-dom@latest/client?dev",
          "react/jsx-runtime": "https://esm.sh/react@latest/jsx-runtime?dev"
        }
      }
    </script>

    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone@latest/babel.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="text/babel" data-type="module" data-process="react">
      import React from "react";
      import { createRoot } from "react-dom/client";

      const domNode = document.getElementById("app");

      function createTitle(title){
        // if (title){
        //   return title
        // }
        // else {
        //   return 'Default Title'
        // }

        return title ? title : "Default title";
      }

      function Header({title}) {
        // console.log(title)
        // return <h1>{`Cool ${title}`}</h1>;
        return <h1> {createTitle(title)} </h1>
      }

      function HomePage() {

        const name = ['mani', 'rathore', 'kurrana']

        const [likes, setLikes] = React.useState(1)

        function handleClick() {
          setLikes(likes * 2)
        }


        return (
          <div>
           <Header title="REACT"/>
           <Header title="REACT DOM"/>

           <ul>
            {name.map((name)=> <li key={name}>{name}</li>)}
            </ul>

            <button onClick={handleClick}>Like ({likes})</button>

        </div>
        );
      }

      const root = createRoot(domNode);

      root.render(<HomePage />);
      // const app = document.getElementById("app");

      // const header = document.createElement("h1");

      // const text = "Hello, World!";

      // const headerContent = document.createTextNode(text);

      // header.appendChild(headerContent);

      // app.appendChild(header);
    </script>
  </body>
</html>
